<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>勇者こうせいと大魔王タクソーン</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
#app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:#171717}
#top{height:48px;padding:8px 10px;background:#0d0d0d;border-bottom:2px solid #555;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}
#gameWrap{position:relative;flex:1;min-height:0;background:#000}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#controls{height:215px;position:relative;background:#202020;border-top:2px solid #555;overflow:hidden;touch-action:none;padding-bottom:env(safe-area-inset-bottom)}
#leftZone{position:absolute;left:0;top:0;width:57%;height:100%;touch-action:none}
#divider{position:absolute;left:57%;top:15px;bottom:15px;width:1px;background:#ffffff22}
#joyBase{position:absolute;left:24px;top:31px;width:132px;height:132px;border-radius:50%;background:#292929;border:4px solid #777;box-shadow:inset 0 0 0 12px #202020,0 4px 12px #0008;touch-action:none}
#joyKnob{position:absolute;left:43px;top:43px;width:46px;height:46px;border-radius:50%;background:#8d8d8d;border:3px solid #ddd;box-shadow:0 3px 8px #0008;pointer-events:none}
#moveHint{position:absolute;left:18px;bottom:10px;color:#aaa;font-weight:700;font-size:12px}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;border:2px solid #aaa;color:#fff;font-weight:900;background:#373737;user-select:none;touch-action:none}
#abtn{right:28px;top:30px;width:80px;height:80px;border-radius:50%;background:#8c2929;font-size:25px}
#menuBtn{right:30px;top:128px;width:76px;height:46px;border-radius:10px;font-size:12px}
#msg{position:absolute;left:4%;right:4%;bottom:4%;z-index:20;display:none;background:#050505f2;border:3px solid #fff;border-radius:9px;padding:12px 14px;min-height:84px;line-height:1.5;font-weight:700}
#msg .hint{font-size:11px;color:#bbb;margin-top:5px}
.panel{position:absolute;inset:3%;z-index:25;display:none;background:#070707f7;border:3px solid #fff;border-radius:9px;padding:14px;overflow:auto}
.panel h2{margin:0 0 10px;font-size:20px}
.panel button{width:100%;padding:12px;margin:5px 0;border:2px solid #aaa;border-radius:7px;background:#282828;color:#fff;font-weight:800;font-size:15px}
.small{font-size:12px;color:#ccc}
#title{position:absolute;inset:0;z-index:35;background:linear-gradient(#193054,#080b11);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#title h1{font-size:27px;line-height:1.3;margin:0 0 8px}
#title p{color:#ddd}
#title .ver{font-size:11px;color:#9fb8d9;margin-bottom:12px}
#title button{width:82%;padding:14px;margin:6px;border:2px solid #fff;border-radius:8px;background:#262626;color:#fff;font-size:17px;font-weight:900}
</style>
</head>
<body>
<div id="app">
  <div id="top"><span id="place">オオサカ</span><span id="stats">Lv1 HP 30/30 MP 10/10 100G</span></div>
  <div id="gameWrap">
    <canvas id="game" width="360" height="360"></canvas>
    <div id="msg"></div>
    <div id="menu" class="panel"></div>
    <div id="battle" class="panel"></div>
    <div id="shop" class="panel"></div>
    <div id="title">
      <h1>勇者こうせいと<br>大魔王タクソーン</h1>
      <p>世界の命運は、だいたいこうせいに託された。</p>
      <div class="ver">再構築版 v4</div>
      <button onclick="newGame()">はじめから</button>
      <button onclick="continueGame()">つづきから</button>
    </div>
  </div>
  <div id="controls">
    <div id="leftZone"></div>
    <div id="joyBase"><div id="joyKnob"></div></div>
    <div id="moveHint">左スティックで移動</div>
    <div id="divider"></div>
    <div class="btn" id="abtn">A</div>
    <div class="btn" id="menuBtn">MENU</div>
  </div>
</div>

<script>
const SAVE_KEY='koseiRPG_v4';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const msg=document.getElementById('msg'),menu=document.getElementById('menu'),battle=document.getElementById('battle'),shop=document.getElementById('shop'),title=document.getElementById('title');
const T=24,W=15,H=15;
ctx.imageSmoothingEnabled=false;

let state=null,mode='title',facing='down',enemy=null,bossFight=false,lastEncounterStep=0;

const spells=[
 {name:'屁',lv:1,mp:2,pow:8},{name:'静電気',lv:3,mp:4,pow:16},
 {name:'ちょい波動',lv:6,mp:7,pow:29},{name:'ビッグバン',lv:9,mp:12,pow:50}
];
const swords=[['木っぽい剣',0,0],['銅の剣',80,4],['鉄の剣',180,8],['鋼の剣',350,13],['勇者っぽい剣',650,19],['伝説かもしれない剣',1000,26]];
const heads=[['布の帽子',0,0],['鉄の兜',200,6],['勇者ヘルメット',500,11]];
const bodies=[['旅人の服',0,0],['鉄の鎧',250,7],['勇者ジャケット',700,15]];
const accs=[['なし',0,0],['根性のお守り',120,2],['謎の指輪',300,5],['タコ焼きチャーム',450,8],['上品なお守り',650,11]];

const monsters={
 slime:{name:'スライム',hp:12,atk:5,def:1,xp:5,g:7,color:'#49c6e5'},
 gob:{name:'ゴブリン',hp:20,atk:8,def:2,xp:9,g:12,color:'#6fac4d'},
 hob:{name:'ホブゴブリン',hp:30,atk:11,def:4,xp:15,g:20,color:'#c49b43'},
 toku:{name:'トクレン',hp:40,atk:14,def:6,xp:24,g:32,color:'#d65a5a'},
 riri:{name:'リリポン',hp:48,atk:16,def:7,xp:30,g:40,color:'#c25bd0'}
};
const bosses={
 mat:{name:'まっちゃん',hp:75,atk:12,def:4,xp:55,g:100,color:'#e27a3f'},
 nishi:{name:'ニシ',hp:120,atk:17,def:7,xp:90,g:180,color:'#6f78e8'},
 taku:{name:'大魔王タクソーン',hp:230,atk:23,def:10,xp:0,g:0,color:'#8d2bb5'}
};

const maps={
 osaka:{
  name:'オオサカ',kind:'town',bg:'#b9c77d',
  buildings:[
   {x:1,y:1,w:4,h:3,label:'武器',type:'weapon'},
   {x:6,y:1,w:3,h:3,label:'防具',type:'armor'},
   {x:10,y:1,w:4,h:3,label:'宿',type:'inn'},
   {x:1,y:6,w:4,h:3,label:'教会',type:'church'},
   {x:10,y:6,w:4,h:3,label:'道具',type:'item'}
  ],
  npcs:[
   {x:7,y:6,text:"兄ちゃんが勇者こうせいか？\\nえらいシュッとしてるやん。知らんけど。"},
   {x:6,y:9,text:"大魔王タクソーン？そら強いやろ。\\n名前に『大』ついとるし。"},
   {x:10,y:11,text:"洞窟のまっちゃん倒してきてや！\\n倒したら第一の証が手に入るらしいで。",quest:1},
   {x:3,y:11,text:"重要なヒント欲しい？\\nワシも欲しいわ。"}
  ],
  exit:{x1:5,x2:9,y:14,to:'field',tx:3,ty:12}
 },
 kyoto:{
  name:'キョウト',kind:'town',bg:'#c8bc91',
  buildings:[
   {x:1,y:1,w:4,h:3,label:'武器',type:'weapon'},
   {x:6,y:1,w:3,h:3,label:'防具',type:'armor'},
   {x:10,y:1,w:4,h:3,label:'宿',type:'inn'},
   {x:1,y:6,w:4,h:3,label:'教会',type:'church'},
   {x:10,y:6,w:4,h:3,label:'道具',type:'item'}
  ],
  npcs:[
   {x:7,y:6,text:"まあ勇者様。\\nずいぶん親しみやすい装備どすなぁ。"},
   {x:5,y:10,text:"洞窟で迷わはったら大変どすなぁ。\\nまあ、あの程度なら迷わへんと思いますけど。"},
   {x:10,y:11,text:"ニシはんを倒していただけると助かります。\\n勇者様なら当然できますやろ？",quest:2},
   {x:3,y:11,text:"お疲れの顔してはりますなぁ。\\n宿屋という便利な建物、ご存じどす？"}
  ],
  exit:{x1:5,x2:9,y:14,to:'field',tx:11,ty:12}
 },
 field:{
  name:'ワールドマップ',kind:'field',bg:'#4f9a4f',
  spots:[
   {x:3,y:13,to:'osaka',tx:7,ty:12,label:'オオサカ'},
   {x:3,y:5,to:'cave1',tx:7,ty:13,label:'洞窟①'},
   {x:11,y:13,to:'kyoto',tx:7,ty:12,label:'キョウト'},
   {x:11,y:5,to:'cave2',tx:7,ty:13,label:'洞窟②'},
   {x:7,y:2,to:'castle',tx:7,ty:12,label:'魔王の屋敷',locked:true}
  ]
 },
 cave1:{
  name:'まっちゃんの洞窟',kind:'dungeon',bg:'#3d3941',
  walls:[[0,0,15,1],[0,0,1,15],[14,0,1,15],[3,3,8,1],[3,7,1,5],[7,5,1,6],[10,7,1,5]],
  exit:{x1:5,x2:9,y:14,to:'field',tx:3,ty:6},
  boss:{x:7,y:1,id:'mat'},
  chests:[{x:2,y:5,id:'c1a',g:80},{x:12,y:9,id:'c1b',item:'herb'},{x:5,y:12,id:'c1c',equip:['sword',2]}]
 },
 cave2:{
  name:'ニシの洞窟',kind:'dungeon',bg:'#343b47',
  walls:[[0,0,15,1],[0,0,1,15],[14,0,1,15],[2,3,10,1],[4,6,1,6],[8,5,1,7],[11,7,1,5]],
  exit:{x1:5,x2:9,y:14,to:'field',tx:11,ty:6},
  boss:{x:7,y:1,id:'nishi'},
  chests:[{x:12,y:5,id:'c2a',g:160},{x:2,y:10,id:'c2b',item:'water'},{x:6,y:12,id:'c2c',equip:['body',2]}]
 },
 castle:{
  name:'大魔王の屋敷',kind:'castle',bg:'#321d38',
  exit:{x1:5,x2:9,y:14,to:'field',tx:7,ty:3},
  boss:{x:7,y:4,id:'taku'}
 }
};

function initialState(){
 return {
  map:'osaka',x:7,y:11,lv:1,xp:0,next:18,
  hp:30,maxhp:30,mp:10,maxmp:10,atk:7,def:3,g:100,
  items:{herb:2,water:1,warp:0},
  owned:{sword:[0],head:[0],body:[0],acc:[0]},
  eq:{sword:0,head:0,body:0,acc:0},
  flags:{quest1:false,boss1:false,quest2:false,boss2:false,final:false},
  chests:{},save:null,steps:0
 };
}
function newGame(){
 state=initialState();mode='map';title.style.display='none';render();
 showText("世界は大魔王タクソーンに支配されようとしていた！\\n勇者に選ばれたこうせいは一人で旅立つことになった。\\n\\nまずは町の『！』が付いた住人に A で話しかけよう。");
}
function continueGame(){
 const raw=localStorage.getItem(SAVE_KEY);
 if(!raw){alert('この再構築版のセーブデータはまだない！\\n「はじめから」で開始してね。');return}
 state=JSON.parse(raw);mode='map';title.style.display='none';render();
}
function saveGame(){
 state.save={map:state.map,x:state.x,y:state.y};
 localStorage.setItem(SAVE_KEY,JSON.stringify(state));
 showText("教会に冒険の記録を残した！\\n倒れてもここから再出発できる。");
}
function updateTop(){
 if(!state)return;
 document.getElementById('place').textContent=maps[state.map].name;
 document.getElementById('stats').textContent=`Lv${state.lv} HP ${state.hp}/${state.maxhp} MP ${state.mp}/${state.maxmp} ${state.g}G`;
}
function calcAtk(){return state.atk+swords[state.eq.sword][2]}
function calcDef(){return state.def+heads[state.eq.head][2]+bodies[state.eq.body][2]+accs[state.eq.acc][2]}
function bossDone(id){return id==='mat'?state.flags.boss1:id==='nishi'?state.flags.boss2:state.flags.final}
function itemName(k){return {herb:'薬草',water:'聖水',warp:'ワープマン'}[k]}
function equipName(slot,i){return {sword:swords,head:heads,body:bodies,acc:accs}[slot][i][0]}

function showText(t,cb=null){mode='message';msg.innerHTML=t.replace(/\n/g,'<br>')+"<div class='hint'>Aで閉じる</div>";msg.style.display='block';msg._cb=cb}
function closeText(){if(mode!=='message')return;msg.style.display='none';const cb=msg._cb;msg._cb=null;mode='map';if(cb)cb();render()}
function closePanels(){menu.style.display=shop.style.display=battle.style.display='none';mode='map';render()}

function inRect(x,y,r){return x>=r[0]&&x<r[0]+r[2]&&y>=r[1]&&y<r[1]+r[3]}
function isExit(m,x,y){return !!(m.exit&&y===m.exit.y&&x>=m.exit.x1&&x<=m.exit.x2)}
function blocked(x,y){
 const m=maps[state.map];
 if(x<0||y<0||x>=W||y>=H)return true;
 if(isExit(m,x,y))return false;
 if((m.walls||[]).some(r=>inRect(x,y,r)))return true;
 if((m.buildings||[]).some(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h))return true;
 if((m.npcs||[]).some(n=>n.x===x&&n.y===y))return true;
 if((m.chests||[]).some(c=>c.x===x&&c.y===y&&!state.chests[c.id]))return true;
 if(m.boss&&m.boss.x===x&&m.boss.y===y&&!bossDone(m.boss.id))return true;
 return false;
}

function move(dx,dy,dir){
 if(mode!=='map')return;
 facing=dir;
 const nx=state.x+dx,ny=state.y+dy;
 if(blocked(nx,ny)){render();return}
 state.x=nx;state.y=ny;state.steps++;
 transition();
 if(mode==='map'){
  const kind=maps[state.map].kind;
  if((kind==='field'||kind==='dungeon') && state.steps-lastEncounterStep>=3 && Math.random()<0.08){
   lastEncounterStep=state.steps;randomBattle();
  }
 }
 render();
}
function transition(){
 const m=maps[state.map];
 if(isExit(m,state.x,state.y)){go(m.exit.to,m.exit.tx,m.exit.ty);return}
 for(const s of (m.spots||[])){
  if(state.x===s.x&&state.y===s.y){
   if(s.locked&&!(state.flags.boss1&&state.flags.boss2)){showText("不思議な結界に阻まれた。\\n二つの証が必要らしい。");return}
   go(s.to,s.tx,s.ty);return;
  }
 }
}
function go(map,x,y){state.map=map;state.x=x;state.y=y;render();if(map==='castle'&&!state.flags.final)showText("二つの証が光る！\\n大魔王タクソーンの屋敷へ入った！")}

function front(){const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[facing];return[state.x+d[0],state.y+d[1]]}
function interact(){
 if(mode!=='map')return;
 const [x,y]=front(),m=maps[state.map];
 const n=(m.npcs||[]).find(n=>n.x===x&&n.y===y);
 if(n){if(n.quest===1)state.flags.quest1=true;if(n.quest===2)state.flags.quest2=true;showText(n.text);return}
 const b=(m.buildings||[]).find(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h);
 if(b){building(b.type);return}
 const c=(m.chests||[]).find(c=>c.x===x&&c.y===y&&!state.chests[c.id]);
 if(c){openChest(c);return}
 if(m.boss&&m.boss.x===x&&m.boss.y===y&&!bossDone(m.boss.id)){startBattle(m.boss.id,true);return}
 showText("特に何もない。\\nこうせいはちょっと気まずくなった。");
}
function building(type){
 if(type==='church'){showText("神父「冒険の記録、残しとく？」",saveGame);return}
 if(type==='inn'){
  if(state.g<20){showText("宿屋「お金が足りませんえ。」");return}
  state.g-=20;state.hp=state.maxhp;state.mp=state.maxmp;updateTop();showText("宿屋で休んだ！ 20G払った。\\nHPとMPが全回復した。");return
 }
 openShop(type);
}
function openChest(c){
 state.chests[c.id]=true;
 if(c.g){state.g+=c.g;showText(`宝箱から ${c.g}G 手に入れた！`)}
 else if(c.item){state.items[c.item]++;showText(`宝箱から ${itemName(c.item)} を手に入れた！`)}
 else if(c.equip){const [slot,i]=c.equip;if(!state.owned[slot].includes(i))state.owned[slot].push(i);showText(`宝箱から ${equipName(slot,i)} を手に入れた！\\nMENU → そうび から装備できる。`)}
 updateTop();
}

function openShop(type){
 mode='shop';shop.style.display='block';shop._type=type;
 let arr=[];
 if(type==='weapon')arr=swords.slice(1).map((a,i)=>({name:a[0],price:a[1],power:a[2],slot:'sword',index:i+1}));
 else if(type==='armor')arr=[
  ...heads.slice(1).map((a,i)=>({name:a[0],price:a[1],power:a[2],slot:'head',index:i+1})),
  ...bodies.slice(1).map((a,i)=>({name:a[0],price:a[1],power:a[2],slot:'body',index:i+1})),
  ...accs.slice(1).map((a,i)=>({name:a[0],price:a[1],power:a[2],slot:'acc',index:i+1}))
 ];
 else arr=[{name:'薬草',price:15,item:'herb'},{name:'聖水',price:25,item:'water'},{name:'ワープマン',price:40,item:'warp'}];
 shop._arr=arr;
 shop.innerHTML=`<h2>${type==='weapon'?'武器屋':type==='armor'?'防具屋':'道具屋'}</h2><p class="small">${state.g}G</p>`+
 arr.map((it,i)=>`<button onclick="buy(${i})">${it.name}　${it.price}G${it.power!=null?'　強さ+'+it.power:''}</button>`).join('')+
 `<button onclick="closePanels()">やめる</button>`;
}
function buy(i){
 const it=shop._arr[i];if(state.g<it.price){showText("お金が足りない！");return}
 state.g-=it.price;
 if(it.item)state.items[it.item]++;
 else{if(!state.owned[it.slot].includes(it.index))state.owned[it.slot].push(it.index);state.eq[it.slot]=it.index}
 updateTop();openShop(shop._type);
}

function openMenu(){
 if(mode!=='map')return;
 mode='menu';menu.style.display='block';
 const obj=!state.flags.quest1?'オオサカの「！」の住人に話す':!state.flags.boss1?'洞窟①のまっちゃんを倒す':!state.flags.quest2?'キョウトの「！」の住人に話す':!state.flags.boss2?'洞窟②のニシを倒す':!state.flags.final?'大魔王タクソーンの屋敷へ':'世界は救われた！';
 menu.innerHTML=`<h2>MENU</h2><p class="small">目的：${obj}</p><button onclick="equipMenu()">そうび</button><button onclick="itemMenu()">どうぐ</button><button onclick="statusMenu()">つよさ</button><button onclick="closePanels()">閉じる</button>`;
}
function mainMenu(){mode='map';menu.style.display='none';openMenu()}
function equipMenu(){
 menu.innerHTML=`<h2>そうび</h2><p>攻撃 ${calcAtk()}　防御 ${calcDef()}</p>
 <button onclick="choose('sword')">武器：${swords[state.eq.sword][0]}</button>
 <button onclick="choose('head')">頭：${heads[state.eq.head][0]}</button>
 <button onclick="choose('body')">胴：${bodies[state.eq.body][0]}</button>
 <button onclick="choose('acc')">アクセ：${accs[state.eq.acc][0]}</button>
 <button onclick="mainMenu()">戻る</button>`;
}
function choose(slot){
 const arr={sword:swords,head:heads,body:bodies,acc:accs}[slot];
 menu.innerHTML=`<h2>装備を選ぶ</h2>`+state.owned[slot].map(i=>`<button onclick="setEquip('${slot}',${i})">${state.eq[slot]===i?'▶ ':''}${arr[i][0]}　${slot==='sword'?'攻撃':'防御'}+${arr[i][2]}</button>`).join('')+`<button onclick="equipMenu()">戻る</button>`;
}
function setEquip(slot,i){state.eq[slot]=i;updateTop();equipMenu()}
function itemMenu(){
 menu.innerHTML=`<h2>どうぐ</h2><p>薬草×${state.items.herb}<br>聖水×${state.items.water}<br>ワープマン×${state.items.warp}</p>
 <button onclick="fieldItem('herb')">薬草を使う</button><button onclick="fieldItem('water')">聖水を使う</button><button onclick="fieldItem('warp')">ワープマンを使う</button><button onclick="mainMenu()">戻る</button>`;
}
function fieldItem(k){
 if(state.items[k]<=0)return;
 if(k==='herb'){state.items[k]--;state.hp=Math.min(state.maxhp,state.hp+25)}
 else if(k==='water'){state.items[k]--;state.mp=Math.min(state.maxmp,state.mp+12)}
 else{if(maps[state.map].kind!=='dungeon')return;state.items[k]--;go('field',state.map==='cave1'?3:11,6)}
 updateTop();itemMenu();
}
function statusMenu(){menu.innerHTML=`<h2>つよさ</h2><p>Lv ${state.lv}<br>HP ${state.hp}/${state.maxhp}<br>MP ${state.mp}/${state.maxmp}<br>攻撃 ${calcAtk()}<br>防御 ${calcDef()}<br>EXP ${state.xp}/${state.next}<br>${state.g}G</p><button onclick="mainMenu()">戻る</button>`}

function randomBattle(){
 const pool=state.map==='cave1'?['slime','gob','hob']:state.map==='cave2'?['hob','toku','riri']:state.flags.boss1?['gob','hob','toku']:['slime','gob'];
 startBattle(pool[Math.floor(Math.random()*pool.length)],false);
}
function startBattle(id,boss){
 mode='battle';bossFight=boss;const src=boss?bosses[id]:monsters[id];enemy={...src,id,maxhp:src.hp};battle.style.display='block';battleUI(`${enemy.name}が あらわれた！`);
}
function battleUI(t='どうする？'){battle.innerHTML=`<h2>${enemy.name}</h2><p>敵HP ${Math.max(0,enemy.hp)}/${enemy.maxhp}</p><p>${t}</p><button onclick="attack()">たたかう</button><button onclick="spellMenu()">じゅもん</button><button onclick="battleItems()">どうぐ</button><button onclick="runAway()">にげる</button>`}
function attack(){const d=Math.max(1,calcAtk()+Math.floor(Math.random()*5)-enemy.def);enemy.hp-=d;if(enemy.hp<=0)return win();enemyTurn(`こうせいの攻撃！ ${d}ダメージ！`)}
function spellMenu(){battle._sp=spells.filter(s=>state.lv>=s.lv);battle.innerHTML=`<h2>じゅもん</h2>`+battle._sp.map((s,i)=>`<button onclick="cast(${i})">${s.name}　MP${s.mp}</button>`).join('')+`<button onclick="battleUI()">戻る</button>`}
function cast(i){const s=battle._sp[i];if(state.mp<s.mp){battleUI("MPが足りない！");return}state.mp-=s.mp;const d=Math.max(1,Math.floor(s.pow+Math.random()*6+state.lv-enemy.def/2));enemy.hp-=d;if(enemy.hp<=0)return win();enemyTurn(`${s.name}！ ${d}ダメージ！`)}
function battleItems(){battle.innerHTML=`<h2>どうぐ</h2><button onclick="bUse('herb')">薬草 ×${state.items.herb}</button><button onclick="bUse('water')">聖水 ×${state.items.water}</button><button onclick="battleUI()">戻る</button>`}
function bUse(k){if(state.items[k]<=0){battleUI("持っていない！");return}state.items[k]--;if(k==='herb')state.hp=Math.min(state.maxhp,state.hp+25);else state.mp=Math.min(state.maxmp,state.mp+12);enemyTurn(`${itemName(k)}を使った！`)}
function enemyTurn(prefix){const d=Math.max(1,enemy.atk+Math.floor(Math.random()*5)-calcDef());state.hp-=d;updateTop();if(state.hp<=0)return die();battleUI(`${prefix}<br>${enemy.name}の攻撃！ ${d}ダメージ！`)}
function runAway(){if(bossFight){battleUI("ボス戦からは逃げられない！");return}if(Math.random()<0.8){closePanels();showText("うまく逃げ切った！")}else enemyTurn("しかし回り込まれた！")}
function win(){
 const id=enemy.id,name=enemy.name,xp=enemy.xp,g=enemy.g;state.g+=g;state.xp+=xp;
 if(bossFight){if(id==='mat')state.flags.boss1=true;if(id==='nishi')state.flags.boss2=true;if(id==='taku')state.flags.final=true}
 battle.style.display='none';mode='map';
 let text=`${name}を倒した！\\n${xp}EXP と ${g}G を手に入れた！${levelUp()}`;
 if(id==='mat')text+="\\n第一の証を手に入れた！";
 if(id==='nishi')text+="\\n第二の証を手に入れた！\\n魔王の屋敷の結界が消えた！";
 if(id==='taku')text+="\\n\\n大魔王タクソーンは倒れた！\\n世界に平和が戻った！\\n\\n― おしまい ―";
 showText(text);updateTop();
}
function levelUp(){let o='';while(state.xp>=state.next&&state.lv<15){state.xp-=state.next;state.lv++;state.next=Math.floor(state.next*1.45);state.maxhp+=7;state.maxmp+=3;state.atk+=3;state.def+=2;state.hp=state.maxhp;state.mp=state.maxmp;o+=`\\nレベル${state.lv}になった！`;const s=spells.find(s=>s.lv===state.lv);if(s)o+=`\\n「${s.name}」を覚えた！`}return o}
function die(){battle.style.display='none';state.hp=state.maxhp;state.mp=state.maxmp;if(state.save){state.map=state.save.map;state.x=state.save.x;state.y=state.save.y}else{state.map='osaka';state.x=7;state.y=11}showText("こうせいは力尽きた……。\\n最後に記録した教会から再出発！");updateTop()}

// ---------- drawing ----------
function ground(m){
 if(m.kind==='dungeon'){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
   ctx.fillStyle=(x+y)%2?'#454149':'#3d3941';ctx.fillRect(x*T,y*T,T,T);ctx.strokeStyle='#2d2a31';ctx.strokeRect(x*T,y*T,T,T);
   if((x*7+y*11)%10===0){ctx.strokeStyle='#6a6570';ctx.beginPath();ctx.moveTo(x*T+5,y*T+8);ctx.lineTo(x*T+11,y*T+6);ctx.lineTo(x*T+15,y*T+11);ctx.stroke()}
  }
 }else{
  ctx.fillStyle=m.bg;ctx.fillRect(0,0,360,360);
  ctx.strokeStyle='#0000000f';
  for(let i=0;i<=360;i+=T){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,360);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(360,i);ctx.stroke()}
 }
}
function walls(m){
 for(const r of (m.walls||[]))for(let yy=r[1];yy<r[1]+r[3];yy++)for(let xx=r[0];xx<r[0]+r[2];xx++){
  ctx.fillStyle=m.kind==='dungeon'?'#242229':'#202020';ctx.fillRect(xx*T,yy*T,T,T);
  if(m.kind==='dungeon'){ctx.fillStyle='#57525d';ctx.fillRect(xx*T+2,yy*T+2,T-4,7);ctx.fillStyle='#34313a';ctx.fillRect(xx*T+3,yy*T+10,T-6,T-13)}
 }
}
function buildingArt(b){
 const x=b.x*T,y=b.y*T,w=b.w*T,h=b.h*T;ctx.fillStyle='#00000035';ctx.fillRect(x+6,y+7,w,h-3);
 ctx.fillStyle=b.type==='church'?'#c9c5d8':'#d7bb8d';ctx.fillRect(x+2,y+13,w-4,h-15);
 let roof={weapon:'#8b3d2d',armor:'#46617e',inn:'#8d4d73',church:'#555e91',item:'#47764f'}[b.type]||'#914531';
 ctx.fillStyle='#3b2b25';ctx.fillRect(x-3,y+9,w+6,5);ctx.fillStyle=roof;ctx.fillRect(x-4,y+2,w+8,12);ctx.fillStyle='#ffffff20';ctx.fillRect(x-1,y+4,w+2,3);
 ctx.fillStyle='#463729';ctx.fillRect(x+6,y+23,15,12);ctx.fillRect(x+w-21,y+23,15,12);ctx.fillStyle='#8dd5e8';ctx.fillRect(x+8,y+25,11,8);ctx.fillRect(x+w-19,y+25,11,8);
 ctx.fillStyle='#3b2a22';ctx.fillRect(x+w/2-10,y+h-25,20,23);ctx.fillStyle='#76503a';ctx.fillRect(x+w/2-7,y+h-22,14,20);
 ctx.fillStyle='#5b402a';ctx.fillRect(x+w/2-23,y+8,46,18);ctx.fillStyle='#f2dfb7';ctx.fillRect(x+w/2-20,y+10,40,14);ctx.fillStyle='#28211b';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(b.label,x+w/2,y+20);ctx.textAlign='left';
}
function npcArt(px,py,c,i){
 ctx.fillStyle='#0004';ctx.fillRect(px+5,py+20,15,3);ctx.fillStyle='#38313a';ctx.fillRect(px+7,py+15,4,6);ctx.fillRect(px+13,py+15,4,6);
 ctx.fillStyle=c;ctx.fillRect(px+5,py+9,14,8);ctx.fillRect(px+3,py+10,3,6);ctx.fillRect(px+19,py+10,3,6);
 ctx.fillStyle='#f0c19c';ctx.fillRect(px+7,py+3,10,8);ctx.fillStyle=i%2?'#51351f':'#2b211b';ctx.fillRect(px+6,py+1,12,4);ctx.fillStyle='#222';ctx.fillRect(px+9,py+6,2,1);ctx.fillRect(px+14,py+6,2,1);
}
function heroArt(px,py){
 ctx.fillStyle='#0005';ctx.fillRect(px+4,py+20,17,3);ctx.fillStyle='#a5272d';ctx.fillRect(px+3,py+8,18,12);
 ctx.fillStyle='#392d25';ctx.fillRect(px+7,py+16,4,6);ctx.fillRect(px+14,py+16,4,6);ctx.fillStyle='#2764bd';ctx.fillRect(px+6,py+9,13,9);
 ctx.fillStyle='#d7b45a';ctx.fillRect(px+6,py+14,13,2);ctx.fillStyle='#f1c19c';ctx.fillRect(px+8,py+3,10,8);ctx.fillStyle='#382414';ctx.fillRect(px+7,py+1,12,4);
 ctx.fillStyle='#171717';ctx.fillRect(px+10,py+6,2,1);ctx.fillRect(px+15,py+6,2,1);ctx.fillStyle='#d9dde3';ctx.fillRect(px+20,py+8,2,10);ctx.fillStyle='#b9973e';ctx.fillRect(px+18,py+13,6,2);
}
function dungeonDecor(m){
 if(m.kind!=='dungeon')return;
 for(const [tx,ty] of [[2,2],[12,4],[5,9],[9,12]]){ctx.fillStyle='#6f4a2c';ctx.fillRect(tx*T+10,ty*T+10,3,10);ctx.fillStyle='#ffcb54';ctx.beginPath();ctx.arc(tx*T+11,ty*T+7,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7a32';ctx.beginPath();ctx.arc(tx*T+11,ty*T+8,3,0,Math.PI*2);ctx.fill()}
}
function monsterArt(x,y,c,big=false){ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x+12,y+22,big?12:9,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+12,y+11,big?10:8,0,Math.PI*2);ctx.fill();ctx.fillRect(x+(big?4:6),y+11,big?16:12,big?10:8);ctx.fillStyle='#fff';ctx.fillRect(x+8,y+8,3,3);ctx.fillRect(x+15,y+8,3,3)}
function render(){
 if(!state)return;
 const m=maps[state.map]; // ONE map source only
 ground(m);walls(m);dungeonDecor(m);
 for(const b of (m.buildings||[]))buildingArt(b);
 for(const s of (m.spots||[])){ctx.fillStyle=s.locked?'#5b255d':'#765d35';ctx.fillRect(s.x*T,s.y*T,T,T);ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.fillText(s.label,s.x*T-10,s.y*T-3)}
 if(m.exit){ctx.fillStyle='#f6d64a';ctx.fillRect(m.exit.x1*T+2,m.exit.y*T+2,(m.exit.x2-m.exit.x1+1)*T-4,T-4);ctx.fillStyle='#30260a';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('出口',((m.exit.x1+m.exit.x2+1)/2)*T,m.exit.y*T+16);ctx.textAlign='left'}
 const cols=['#c14f4f','#4d7fb8','#699b55','#bd8744','#7f62a5'];
 (m.npcs||[]).forEach((n,i)=>{npcArt(n.x*T,n.y*T,cols[i%cols.length],i);if((n.quest===1&&!state.flags.quest1)||(n.quest===2&&!state.flags.quest2)){ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(n.x*T+12,n.y*T-3,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.font='bold 11px sans-serif';ctx.fillText('!',n.x*T+10,n.y*T+1)}});
 for(const c of (m.chests||[]))if(!state.chests[c.id]){ctx.fillStyle='#5b371c';ctx.fillRect(c.x*T+2,c.y*T+9,20,12);ctx.fillStyle='#d69a32';ctx.fillRect(c.x*T+3,c.y*T+6,18,8);ctx.fillStyle='#f0c85a';ctx.fillRect(c.x*T+10,c.y*T+11,4,6)}
 if(m.boss&&!bossDone(m.boss.id))monsterArt(m.boss.x*T,m.boss.y*T,bosses[m.boss.id].color,true);
 heroArt(state.x*T,state.y*T); // ALWAYS LAST
 if(m.kind==='town'){const guide=(state.map==='osaka'&&!state.flags.quest1)||(state.map==='kyoto'&&!state.flags.quest2)?'Aで「！」の住人に話しかけよう':'黄色い広い「出口」から外へ';ctx.fillStyle='#fffef0ee';ctx.fillRect(48,318,264,28);ctx.strokeStyle='#6f5a2d';ctx.strokeRect(48,318,264,28);ctx.fillStyle='#171717';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(guide,180,337);ctx.textAlign='left'}
 updateTop();
}

// ---------- fixed joystick ----------
const joyBase=document.getElementById('joyBase'),joyKnob=document.getElementById('joyKnob');
let joyPointer=null,joyActive=false,joyDir='',joyInterval=null;
function stopRepeat(){if(joyInterval){clearInterval(joyInterval);joyInterval=null}}
function joyReset(){joyPointer=null;joyActive=false;joyDir='';stopRepeat();joyKnob.style.left='43px';joyKnob.style.top='43px'}
function joyStep(d){if(d==='left')move(-1,0,'left');else if(d==='right')move(1,0,'right');else if(d==='up')move(0,-1,'up');else if(d==='down')move(0,1,'down')}
function joyUpdate(e){
 const r=joyBase.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;const max=36,dist=Math.hypot(dx,dy)||1;
 if(dist>max){dx=dx/dist*max;dy=dy/dist*max}
 joyKnob.style.left=(43+dx)+'px';joyKnob.style.top=(43+dy)+'px';
 let d='';
 if(Math.hypot(dx,dy)>12)d=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
 if(d!==joyDir){joyDir=d;stopRepeat();if(d){joyStep(d);joyInterval=setInterval(()=>{if(joyActive&&joyDir)joyStep(joyDir)},135)}}
}
joyBase.addEventListener('pointerdown',e=>{if(mode!=='map')return;e.preventDefault();joyActive=true;joyPointer=e.pointerId;joyBase.setPointerCapture(e.pointerId);joyUpdate(e)});
joyBase.addEventListener('pointermove',e=>{if(joyActive&&e.pointerId===joyPointer){e.preventDefault();joyUpdate(e)}});
joyBase.addEventListener('pointerup',e=>{if(e.pointerId===joyPointer)joyReset()});
joyBase.addEventListener('pointercancel',e=>{if(e.pointerId===joyPointer)joyReset()});

document.getElementById('abtn').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='message')closeText();else if(mode==='map')interact()});
document.getElementById('menuBtn').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='map')openMenu();else if(mode==='menu')closePanels()});
</script>

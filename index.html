<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>勇者こうせいと大魔王タクソーン</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden;height:100%}
#app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:#181818}
#top{height:46px;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;background:#101010;border-bottom:2px solid #555;font-weight:700;font-size:13px}
#gameWrap{position:relative;flex:1;min-height:0;background:#000}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#msg{position:absolute;left:4%;right:4%;bottom:3%;background:#050505eF;border:3px solid #fff;border-radius:8px;padding:10px 12px;min-height:78px;font-weight:700;line-height:1.45;display:none;z-index:5}
#controls{height:210px;position:relative;background:#202020;border-top:2px solid #555;padding-bottom:env(safe-area-inset-bottom);overflow:hidden;touch-action:none}
.btn{position:absolute;border:2px solid #aaa;background:#353535;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;z-index:3}

#moveZone{position:absolute;left:0;top:0;width:55%;height:100%;touch-action:none;z-index:2}
#moveHint{position:absolute;left:18px;bottom:12px;color:#aaa;font-size:12px;font-weight:700;pointer-events:none}
#joystick{position:absolute;width:116px;height:116px;border-radius:50%;background:#2b2b2be8;border:3px solid #777;box-shadow:inset 0 0 0 9px #202020,0 4px 12px #0008;display:none;pointer-events:none;z-index:5}
#stick{position:absolute;left:38px;top:38px;width:40px;height:40px;border-radius:50%;background:#8c8c8c;border:3px solid #d0d0d0;box-shadow:0 3px 8px #0008;pointer-events:none}
#controlDivider{position:absolute;left:55%;top:18px;bottom:18px;width:1px;background:#ffffff22;pointer-events:none}

#abtn{right:28px;top:28px;width:78px;height:78px;border-radius:50%;background:#8d2525;font-size:25px;box-shadow:0 4px 10px #0008}
#menuBtn{right:30px;top:124px;width:74px;height:44px;border-radius:10px;font-size:12px}
.panel{position:absolute;inset:3%;background:#080808f5;border:3px solid #fff;border-radius:9px;padding:14px;z-index:10;overflow:auto;display:none}
.panel h2{margin:0 0 10px;font-size:20px}.panel button,.choice{width:100%;padding:12px;margin:5px 0;border:2px solid #aaa;border-radius:7px;background:#252525;color:white;font-weight:800;font-size:15px}
.row{display:flex;gap:7px}.row>*{flex:1}.small{font-size:12px;color:#ccc}
#battleChoices{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#battleChoices button{padding:12px;background:#222;color:white;border:2px solid #aaa;border-radius:6px;font-weight:800}
#title{position:absolute;inset:0;background:linear-gradient(#17294a,#080b12);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px}
#title h1{font-size:27px;line-height:1.3;margin:0 0 8px}#title p{color:#ddd}
#title button{width:80%;padding:14px;margin:6px;border:2px solid white;border-radius:8px;background:#252525;color:#fff;font-size:17px;font-weight:900}
</style>
</head>
<body>
<div id="app">
<div id="top"><span id="place">オオサカ</span><span id="stats">Lv1 HP 30/30 MP 10/10 100G</span></div>
<div id="gameWrap">
<canvas id="game" width="360" height="360"></canvas>
<div id="msg"></div>
<div id="menu" class="panel"></div>
<div id="battle" class="panel"></div>
<div id="shop" class="panel"></div>
<div id="title">
<h1>勇者こうせいと<br>大魔王タクソーン</h1>
<p>世界の命運は、だいたいこうせいに託された。</p>
<button onclick="newGame()">はじめから</button>
<button onclick="continueGame()">つづきから</button>
</div>
</div>
<div id="controls">
  <div id="moveZone"></div>
  <div id="moveHint">左側の好きな場所を触って移動</div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="controlDivider"></div>
  <div class="btn" id="abtn">A</div>
  <div class="btn" id="menuBtn">MENU</div>
</div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const msg=document.getElementById('msg'), menu=document.getElementById('menu'), battle=document.getElementById('battle'), shop=document.getElementById('shop');
const W=15,H=15,T=24;
let state,mode='map',lastDir='down',stepCount=0;

const spells=[
 {name:'屁',lv:1,mp:2,pow:8},{name:'静電気',lv:3,mp:4,pow:16},
 {name:'ちょい波動',lv:6,mp:7,pow:28},{name:'ビッグバン',lv:9,mp:12,pow:48}
];
const swords=[
 ['木っぽい剣',0,0],['銅の剣',80,4],['鉄の剣',180,8],['鋼の剣',350,13],['勇者っぽい剣',650,19],['伝説かもしれない剣',1000,26]
];
const heads=[['布の帽子',60,2],['鉄の兜',200,6],['勇者ヘルメット',500,11]];
const bodies=[['旅人の服',0,0],['鉄の鎧',250,7],['勇者ジャケット',700,15]];
const accs=[['なし',0,0],['根性のお守り',120,2],['謎の指輪',300,5],['タコ焼きチャーム',450,8],['上品なお守り',650,11]];
const monsters={
 slime:{name:'スライム',hp:12,atk:5,def:1,xp:5,g:7,color:'#4ac7e8'},
 gob:{name:'ゴブリン',hp:20,atk:8,def:2,xp:9,g:12,color:'#70b94c'},
 hob:{name:'ホブゴブリン',hp:30,atk:11,def:4,xp:15,g:20,color:'#c59b45'},
 toku:{name:'トクレン',hp:40,atk:14,def:6,xp:24,g:32,color:'#d85a5a'},
 riri:{name:'リリポン',hp:48,atk:16,def:7,xp:30,g:40,color:'#c55bd5'}
};
const bosses={
 mat:{name:'まっちゃん',hp:75,atk:12,def:4,xp:55,g:100,color:'#e27a3f'},
 nishi:{name:'ニシ',hp:120,atk:17,def:7,xp:90,g:180,color:'#6f78e8'},
 taku:{name:'大魔王タクソーン',hp:230,atk:23,def:10,xp:0,g:0,color:'#8d2bb5'}
};
function baseState(){return {map:'osaka',x:7,y:11,lv:1,xp:0,next:18,hp:30,maxhp:30,mp:10,maxmp:10,atk:7,def:3,g:100,
 items:{herb:2,water:1,warp:0},
 owned:{sword:[0],head:[0],body:[0],acc:[0]},
 eq:{sword:0,head:0,body:0,acc:0},
 flags:{quest1:false,boss1:false,quest2:false,boss2:false,final:false},
 chests:{},save:null};}
const maps={
 osaka:{name:'オオサカ',kind:'town',bg:'#b7c47a',walls:[[0,0,15,1],[0,14,15,1],[0,0,1,15],[14,0,1,15]],
 buildings:[
  {x:1,y:1,w:4,h:3,label:'武器',type:'weapon'},
  {x:6,y:1,w:3,h:3,label:'防具',type:'armor'},
  {x:10,y:1,w:4,h:3,label:'宿',type:'inn'},
  {x:1,y:6,w:4,h:3,label:'教会',type:'church'},
  {x:10,y:6,w:4,h:3,label:'道具',type:'item'}
 ],npcs:[
  {x:7,y:6,t:"兄ちゃんが勇者こうせいか？\nえらいシュッとしてるやん。知らんけど。"},
  {x:6,y:9,t:"大魔王タクソーン？そら強いやろ。\n名前に『大』ついとるし。"},
  {x:10,y:11,t:"洞窟のまっちゃん倒してきてや！",quest:1},
  {x:3,y:11,t:"重要なヒント欲しい？\nワシも欲しいわ。"}
 ],exit:{x:7,y:13,to:'field',tx:3,ty:12}},
 kyoto:{name:'キョウト',kind:'town',bg:'#c6b98d',walls:[[0,0,15,1],[0,14,15,1],[0,0,1,15],[14,0,1,15]],
 buildings:[
  {x:1,y:1,w:4,h:3,label:'武器',type:'weapon'},
  {x:6,y:1,w:3,h:3,label:'防具',type:'armor'},
  {x:10,y:1,w:4,h:3,label:'宿',type:'inn'},
  {x:1,y:6,w:4,h:3,label:'教会',type:'church'},
  {x:10,y:6,w:4,h:3,label:'道具',type:'item'}
 ],npcs:[
  {x:7,y:6,t:"まあ勇者様。\nずいぶん親しみやすい装備どすなぁ。"},
  {x:5,y:10,t:"洞窟で迷わはったら大変どすなぁ。\nまあ、あの程度なら迷わへんと思いますけど。"},
  {x:10,y:11,t:"ニシはんを倒していただけると助かります。\n勇者様なら当然できますやろ？",quest:2},
  {x:3,y:11,t:"お疲れの顔してはりますなぁ。\n宿屋という便利な建物、ご存じどす？"}
 ],exit:{x:7,y:13,to:'field',tx:11,ty:12}},
 field:{name:'ワールドマップ',kind:'field',bg:'#4f9a4f',walls:[[0,0,15,1],[0,14,15,1],[0,0,1,15],[14,0,1,15]],
 spots:[
  {x:3,y:13,to:'osaka',tx:7,ty:13,label:'オオサカ'},
  {x:3,y:5,to:'cave1',tx:7,ty:13,label:'洞窟①'},
  {x:11,y:13,to:'kyoto',tx:7,ty:13,label:'キョウト'},
  {x:11,y:5,to:'cave2',tx:7,ty:13,label:'洞窟②'},
  {x:7,y:2,to:'castle',tx:7,ty:11,label:'魔王の屋敷',locked:true}
 ]},
 cave1:{name:'まっちゃんの洞窟',kind:'dungeon',bg:'#39353a',walls:[[0,0,15,1],[0,14,15,1],[0,0,1,15],[14,0,1,15],[3,3,8,1],[3,7,1,5],[7,5,1,6],[10,7,1,5]],
 exit:{x:7,y:13,to:'field',tx:3,ty:6},boss:{x:7,y:1,id:'mat'},chests:[{x:2,y:5,id:'c1a',g:80},{x:12,y:9,id:'c1b',item:'herb'},{x:5,y:12,id:'c1c',equip:['sword',2]}]},
 cave2:{name:'ニシの洞窟',kind:'dungeon',bg:'#313945',walls:[[0,0,15,1],[0,14,15,1],[0,0,1,15],[14,0,1,15],[2,3,10,1],[4,6,1,6],[8,5,1,7],[11,7,1,5]],
 exit:{x:7,y:13,to:'field',tx:11,ty:6},boss:{x:7,y:1,id:'nishi'},chests:[{x:12,y:5,id:'c2a',g:160},{x:2,y:10,id:'c2b',item:'water'},{x:6,y:12,id:'c2c',equip:['body',2]}]},
 castle:{name:'大魔王の屋敷',kind:'castle',bg:'#321d38',walls:[[0,0,15,1],[0,14,15,1],[0,0,1,15],[14,0,1,15]],boss:{x:7,y:4,id:'taku'},exit:{x:7,y:13,to:'field',tx:7,ty:3}}
};
function newGame(){state=baseState();document.getElementById('title').style.display='none';showText("世界は大魔王タクソーンに支配されようとしていた！\nなぜか勇者に選ばれたこうせいは、一人で旅立つことになった！\n\nまずはオオサカの住人に話を聞こう。\n住人の前で A を押すと話しかけられるぞ！");render();}
function continueGame(){
 let s=localStorage.getItem('koseiRPG');if(!s){showTitleMsg('セーブデータがない！');return}
 state=JSON.parse(s);
 if(!state.owned) state.owned={sword:[0],head:[0],body:[0],acc:[0]};
 for(let k of ['sword','head','body','acc']){
   if(!state.owned[k]) state.owned[k]=[0];
   if(!state.owned[k].includes(0)) state.owned[k].unshift(0);
   if(state.eq && !state.owned[k].includes(state.eq[k])) state.owned[k].push(state.eq[k]);
 }
 document.getElementById('title').style.display='none';render();
}
function showTitleMsg(t){alert(t)}
function saveGame(){state.save={map:state.map,x:state.x,y:state.y};localStorage.setItem('koseiRPG',JSON.stringify(state));showText("教会に冒険の記録を残した！\nこれで安心して無茶できる。");}
function calcAtk(){return state.atk+swords[state.eq.sword][2]}
function calcDef(){return state.def+heads[state.eq.head][2]+bodies[state.eq.body][2]+accs[state.eq.acc][2]}
function updateTop(){document.getElementById('place').textContent=maps[state.map].name;document.getElementById('stats').textContent=`Lv${state.lv} HP ${state.hp}/${state.maxhp} MP ${state.mp}/${state.maxmp} ${state.g}G`;}
function rectHit(x,y,r){return x>=r[0]&&x<r[0]+r[2]&&y>=r[1]&&y<r[1]+r[3]}
function blocked(x,y){
 let m=maps[state.map]; if(x<0||y<0||x>=W||y>=H)return true;
 if((m.walls||[]).some(r=>rectHit(x,y,r))){
   // Town/dungeon exits are a wide 3-tile gate, so those wall tiles are passable.
   if(!(m.exit && y==m.exit.y && Math.abs(x-m.exit.x)<=1)) return true;
 }
 if((m.buildings||[]).some(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h))return true;
 if((m.npcs||[]).some(n=>n.x==x&&n.y==y))return true;
 if((m.chests||[]).some(ch=>ch.x==x&&ch.y==y&&!state.chests[ch.id]))return true;
 if(m.boss && x==m.boss.x&&y==m.boss.y && !bossDone(m.boss.id))return true;
 return false;
}
function move(dx,dy,dir){if(mode!='map')return;lastDir=dir;let nx=state.x+dx,ny=state.y+dy;if(!blocked(nx,ny)){state.x=nx;state.y=ny;stepCount++;checkTransition(); if(mode=='map'&&(maps[state.map].kind=='field'||maps[state.map].kind=='dungeon')&&Math.random()<0.105&&stepCount>2){stepCount=0;randomBattle();}}render();}
function checkTransition(){
 let m=maps[state.map];
 if(m.exit && state.y==m.exit.y && Math.abs(state.x-m.exit.x)<=1){go(m.exit.to,m.exit.tx,m.exit.ty);return}
 for(let s of (m.spots||[])) if(state.x==s.x&&state.y==s.y){if(s.locked&&!(state.flags.boss1&&state.flags.boss2)){showText("不思議な結界に阻まれた。\n二つの証が必要らしい。");return}else go(s.to,s.tx,s.ty)}
}
function go(to,x,y){state.map=to;state.x=x;state.y=y;stepCount=0;if(to=='castle'&&!state.flags.final)showText("二つの証が光る！\n大魔王タクソーンの屋敷へ入った！");}
function front(){let d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[lastDir];return[state.x+d[0],state.y+d[1]]}
function interact(){
 if(mode!='map')return;let [x,y]=front(),m=maps[state.map];
 let n=(m.npcs||[]).find(n=>n.x==x&&n.y==y);if(n){if(n.quest==1)state.flags.quest1=true;if(n.quest==2)state.flags.quest2=true;showText(n.t);return}
 let b=(m.buildings||[]).find(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h);if(b){building(b.type);return}
 let ch=(m.chests||[]).find(q=>q.x==x&&q.y==y&&!state.chests[q.id]);if(ch){openChest(ch);return}
 if(m.boss&&m.boss.x==x&&m.boss.y==y&&!bossDone(m.boss.id)){startBattle(m.boss.id,true);return}
 showText("特に何もない。\nこうせいはちょっと気まずくなった。");
}
function building(type){
 if(type=='church'){showText("神父「記録しとく？ 世界救うんやろ？」",()=>saveGame());return}
 if(type=='inn'){let cost=20;if(state.g>=cost){state.g-=cost;state.hp=state.maxhp;state.mp=state.maxmp;showText(`宿屋で休んだ！ ${cost}G払った。\nHPとMPが全回復した。`)}else showText("宿屋「お金足りませんえ。」");return}
 if(type=='weapon')openShop('weapon'); else if(type=='armor')openShop('armor'); else openShop('item');
}
function openChest(ch){state.chests[ch.id]=true;if(ch.g){state.g+=ch.g;showText(`宝箱から ${ch.g}G 手に入れた！`)}
 else if(ch.item){state.items[ch.item]++;showText(`宝箱から ${itemName(ch.item)} を手に入れた！`)}
 else if(ch.equip){let [k,i]=ch.equip;state.eq[k]=i;showText(`宝箱から ${equipName(k,i)}！\nこうせいはその場で装備した！`)}}
function itemName(k){return {herb:'薬草',water:'聖水',warp:'ワープマン'}[k]}
function equipName(k,i){return {sword:swords,head:heads,body:bodies,acc:accs}[k][i][0]}
function openShop(kind){mode='shop';shop.style.display='block';let arr=kind=='weapon'?swords.slice(1):kind=='armor'?[...heads,...bodies,...accs.slice(1)]:[['薬草',15,'herb'],['聖水',25,'water'],['ワープマン',40,'warp']];
 shop.innerHTML=`<h2>${kind=='weapon'?'武器屋':kind=='armor'?'防具屋':'道具屋'}</h2><div class=small>所持金 ${state.g}G</div>`+
 arr.map((it,idx)=>`<button onclick="buy('${kind}',${idx})">${it[0]}　${it[1]}G${kind!='item'?'　強さ+'+it[2]:''}</button>`).join('')+`<button onclick="closePanels()">やめる</button>`}
function buy(kind,idx){
 let it,slot,real;
 if(kind=='weapon'){real=idx+1;it=swords[real];slot='sword'}
 else if(kind=='armor'){let all=[...heads.map((x,i)=>[x,'head',i]),...bodies.map((x,i)=>[x,'body',i]),...accs.slice(1).map((x,i)=>[x,'acc',i+1])];[it,slot,real]=all[idx]}
 else {let all=[['薬草',15,'herb'],['聖水',25,'water'],['ワープマン',40,'warp']];it=all[idx]}
 if(state.g<it[1]){showText("お金が足りない！");return}
 state.g-=it[1];
 if(kind=='item'){
   state.items[it[2]]++;
 }else{
   if(!state.owned)state.owned={sword:[0],head:[0],body:[0],acc:[0]};
   if(!state.owned[slot].includes(real))state.owned[slot].push(real);
   state.eq[slot]=real;
 }
 updateTop();openShop(kind)
}
function closePanels(){menu.style.display=battle.style.display=shop.style.display='none';mode='map';render()}
function showText(t,cb){mode='message';msg.innerHTML=t.replace(/\n/g,'<br>')+"<div class='small'>Aで閉じる</div>";msg.style.display='block';msg._cb=cb||null}
function closeMsg(){if(mode!='message')return;msg.style.display='none';let cb=msg._cb;msg._cb=null;mode='map';if(cb)cb();render()}
function openMenu(){
 if(mode!='map')return;
 mode='menu';menu.style.display='block';
 let objective=!state.flags.quest1?'オオサカの住人に話を聞く':!state.flags.boss1?'洞窟①のまっちゃんを倒す':!state.flags.quest2?'キョウトの住人に話を聞く':!state.flags.boss2?'洞窟②のニシを倒す':!state.flags.final?'大魔王タクソーンの屋敷へ向かう':'世界は救われた！';
 menu.innerHTML=`<h2>こうせい</h2>
 <p>Lv ${state.lv}　EXP ${state.xp}/${state.next}<br>HP ${state.hp}/${state.maxhp}　MP ${state.mp}/${state.maxmp}<br>攻撃 ${calcAtk()}　防御 ${calcDef()}　${state.g}G</p>
 <p class=small>目的：${objective}</p>
 <button onclick="openEquipMenu()">そうび</button>
 <button onclick="openItemMenu()">どうぐ</button>
 <button onclick="openStatusMenu()">つよさ</button>
 <button onclick="closePanels()">閉じる</button>`;
}
function openStatusMenu(){
 menu.innerHTML=`<h2>つよさ</h2>
 <p>こうせい　Lv ${state.lv}<br>
 HP ${state.hp}/${state.maxhp}<br>MP ${state.mp}/${state.maxmp}<br>
 攻撃 ${calcAtk()}<br>防御 ${calcDef()}<br>
 EXP ${state.xp}/${state.next}<br>${state.g}G</p>
 <p>武器：${swords[state.eq.sword][0]}<br>
 頭：${heads[state.eq.head][0]}<br>
 胴：${bodies[state.eq.body][0]}<br>
 アクセ：${accs[state.eq.acc][0]}</p>
 <button onclick="openMenuFromPanel()">戻る</button>`;
}
function openItemMenu(){
 menu.innerHTML=`<h2>どうぐ</h2>
 <p>薬草×${state.items.herb}　聖水×${state.items.water}<br>ワープマン×${state.items.warp}</p>
 <button onclick="fieldItem('herb')">薬草を使う</button>
 <button onclick="fieldItem('water')">聖水を使う</button>
 <button onclick="fieldItem('warp')">ワープマンを使う</button>
 <button onclick="openMenuFromPanel()">戻る</button>`;
}
function openMenuFromPanel(){
 mode='map';menu.style.display='none';openMenu();
}
function openEquipMenu(){
 if(!state.owned)state.owned={sword:[0],head:[0],body:[0],acc:[0]};
 menu.innerHTML=`<h2>そうび</h2>
 <p class=small>持っている装備から自由に付け替えられる。</p>
 <button onclick="chooseEquip('sword')">武器　${swords[state.eq.sword][0]}　攻撃+${swords[state.eq.sword][2]}</button>
 <button onclick="chooseEquip('head')">頭　${heads[state.eq.head][0]}　防御+${heads[state.eq.head][2]}</button>
 <button onclick="chooseEquip('body')">胴　${bodies[state.eq.body][0]}　防御+${bodies[state.eq.body][2]}</button>
 <button onclick="chooseEquip('acc')">アクセ　${accs[state.eq.acc][0]}　防御+${accs[state.eq.acc][2]}</button>
 <p>現在：攻撃 ${calcAtk()} / 防御 ${calcDef()}</p>
 <button onclick="openMenuFromPanel()">戻る</button>`;
}
function chooseEquip(slot){
 const arr={sword:swords,head:heads,body:bodies,acc:accs}[slot];
 const label={sword:'武器',head:'頭',body:'胴',acc:'アクセ'}[slot];
 const owned=(state.owned&&state.owned[slot])?state.owned[slot]:[0];
 menu.innerHTML=`<h2>${label}を選ぶ</h2>`+
   owned.map(i=>`<button onclick="equipItem('${slot}',${i})">${state.eq[slot]===i?'▶ ':''}${arr[i][0]}　${slot==='sword'?'攻撃':'防御'}+${arr[i][2]}</button>`).join('')+
   `<button onclick="openEquipMenu()">戻る</button>`;
}
function equipItem(slot,i){
 state.eq[slot]=i;updateTop();openEquipMenu();
}
function drawHero(px,py){
  // shadow
  ctx.fillStyle='#00000044';ctx.fillRect(px+4,py+20,17,3);
  // red cape behind body
  ctx.fillStyle='#a5272d';ctx.fillRect(px+4,py+8,17,11);ctx.fillRect(px+3,py+13,4,7);
  // boots
  ctx.fillStyle='#392d25';ctx.fillRect(px+7,py+16,4,6);ctx.fillRect(px+14,py+16,4,6);
  // blue tunic
  ctx.fillStyle='#2764bd';ctx.fillRect(px+6,py+9,13,9);
  // belt
  ctx.fillStyle='#d7b45a';ctx.fillRect(px+6,py+14,13,2);
  // head
  ctx.fillStyle='#f1c19c';ctx.fillRect(px+8,py+3,10,8);
  // hero hair
  ctx.fillStyle='#382414';ctx.fillRect(px+7,py+1,12,4);ctx.fillRect(px+7,py+4,3,3);
  // eyes
  ctx.fillStyle='#171717';ctx.fillRect(px+10,py+6,2,1);ctx.fillRect(px+15,py+6,2,1);
  // sword on right side
  ctx.fillStyle='#d9dde3';ctx.fillRect(px+20,py+8,2,10);ctx.fillStyle='#b9973e';ctx.fillRect(px+18,py+13,6,2);
}
function drawBuilding(b){
 const x=b.x*T,y=b.y*T,w=b.w*T,h=b.h*T;
 // ground shadow
 ctx.fillStyle='#0000003a';ctx.fillRect(x+6,y+8,w,h-3);

 // wall base
 ctx.fillStyle=b.type==='church'?'#c8c4d6':'#d7bb8d';
 ctx.fillRect(x+2,y+13,w-4,h-15);

 // wall texture blocks
 ctx.fillStyle='#ffffff16';
 for(let yy=y+18;yy<y+h-8;yy+=10)for(let xx=x+5;xx<x+w-5;xx+=16)ctx.fillRect(xx,yy,9,4);

 // roof
 let roof='#914531';
 if(b.type==='church')roof='#555e91';
 if(b.type==='inn')roof='#8d4d73';
 if(b.type==='weapon')roof='#8b3d2d';
 if(b.type==='armor')roof='#46617e';
 if(b.type==='item')roof='#47764f';
 ctx.fillStyle='#3b2b25';ctx.fillRect(x-3,y+9,w+6,5);
 ctx.fillStyle=roof;ctx.fillRect(x-4,y+2,w+8,12);
 ctx.fillStyle='#ffffff20';ctx.fillRect(x-1,y+4,w+2,3);

 // roof trim
 ctx.fillStyle='#2c2522';for(let xx=x-2;xx<x+w+2;xx+=8)ctx.fillRect(xx,y+12,5,2);

 // windows
 ctx.fillStyle='#463729';ctx.fillRect(x+6,y+23,15,12);ctx.fillRect(x+w-21,y+23,15,12);
 ctx.fillStyle='#8dd5e8';ctx.fillRect(x+8,y+25,11,8);ctx.fillRect(x+w-19,y+25,11,8);
 ctx.fillStyle='#fff6aa99';ctx.fillRect(x+9,y+26,4,6);ctx.fillRect(x+w-18,y+26,4,6);

 // door + frame
 ctx.fillStyle='#3b2a22';ctx.fillRect(x+w/2-10,y+h-25,20,23);
 ctx.fillStyle='#76503a';ctx.fillRect(x+w/2-7,y+h-22,14,20);
 ctx.fillStyle='#e3bd4f';ctx.fillRect(x+w/2+3,y+h-13,2,2);

 // sign
 ctx.fillStyle='#5b402a';ctx.fillRect(x+w/2-23,y+8,46,18);
 ctx.fillStyle='#f2dfb7';ctx.fillRect(x+w/2-20,y+10,40,14);
 ctx.fillStyle='#28211b';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
 ctx.fillText(b.label,x+w/2,y+20);ctx.textAlign='left';

 // Special icon
 ctx.fillStyle='#242424';
 if(b.type==='weapon'){ctx.fillRect(x+w/2-1,y+12,2,8);ctx.fillRect(x+w/2-4,y+17,8,2)}
 if(b.type==='church'){ctx.fillRect(x+w/2-1,y-5,3,9);ctx.fillRect(x+w/2-5,y-2,11,3)}
}

function drawDungeonBackdrop(m){
 // stone floor tiles
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
   let alt=(x+y)%2;
   ctx.fillStyle=alt?'#454149':'#3d3941';
   ctx.fillRect(x*T,y*T,T,T);
   ctx.strokeStyle='#2c2930';ctx.strokeRect(x*T,y*T,T,T);
   // tiny cracks
   if((x*7+y*11)%9===0){
     ctx.strokeStyle='#69636d';ctx.beginPath();
     ctx.moveTo(x*T+5,y*T+8);ctx.lineTo(x*T+11,y*T+6);ctx.lineTo(x*T+15,y*T+11);ctx.stroke();
   }
 }
 // wall blocks become rock faces
 for(let r of(m.walls||[])){
   for(let yy=r[1];yy<r[1]+r[3];yy++)for(let xx=r[0];xx<r[0]+r[2];xx++){
     ctx.fillStyle='#232129';ctx.fillRect(xx*T,yy*T,T,T);
     ctx.fillStyle='#55515b';ctx.fillRect(xx*T+2,yy*T+2,T-4,7);
     ctx.fillStyle='#34313a';ctx.fillRect(xx*T+3,yy*T+10,T-6,T-13);
     ctx.strokeStyle='#17161b';ctx.strokeRect(xx*T+1,yy*T+1,T-2,T-2);
   }
 }
 // decorative rocks
 for(let i=0;i<12;i++){
   let rx=((i*37+19)%13+1)*T, ry=((i*53+7)%12+1)*T;
   if(!blocked(Math.floor(rx/T),Math.floor(ry/T))){
     ctx.fillStyle='#5a5660';ctx.beginPath();ctx.arc(rx+7,ry+14,5+(i%3),0,Math.PI*2);ctx.fill();
     ctx.fillStyle='#77717c';ctx.fillRect(rx+5,ry+10,5,2);
   }
 }
 // torches for warmth/depth
 for(let i=0;i<4;i++){
   let tx=[2,12,5,9][i]*T, ty=[2,4,9,12][i]*T;
   ctx.fillStyle='#6f4a2c';ctx.fillRect(tx+10,ty+10,3,10);
   ctx.fillStyle='#ffcb54';ctx.beginPath();ctx.arc(tx+11,ty+7,5,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#ff7a32';ctx.beginPath();ctx.arc(tx+11,ty+8,3,0,Math.PI*2);ctx.fill();
 }
}
function render(){
 if(!state)return;
 let m=maps[state.map];
 if(m.kind==='dungeon'){
   drawDungeonBackdrop(m);
 }else{
   ctx.fillStyle=maps[state.map].bg;ctx.fillRect(0,0,360,360);
   ctx.strokeStyle='#00000012';ctx.lineWidth=1;
   for(let gx=0;gx<=360;gx+=T){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,360);ctx.stroke()}
   for(let gy=0;gy<=360;gy+=T){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(360,gy);ctx.stroke()}
   ctx.fillStyle='#202020';
   for(let r of(m.walls||[]))ctx.fillRect(r[0]*T,r[1]*T,r[2]*T,r[3]*T);
 }

 for(let b of(m.buildings||[])) drawBuilding(b);

 for(let s of(m.spots||[])){
   ctx.fillStyle=s.locked?'#5b255d':'#765d35';
   ctx.fillRect(s.x*T,s.y*T,T,T);
   ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.fillText(s.label,s.x*T-10,s.y*T-3)
 }

 // Make exits extremely obvious
 if(m.exit){
   // Wide 3-tile exit gate
   ctx.fillStyle='#f6d64a';
   ctx.fillRect((m.exit.x-1)*T+2,m.exit.y*T+2,T*3-4,T-4);
   ctx.fillStyle='#30260a';
   ctx.font='bold 11px sans-serif';ctx.textAlign='center';
   ctx.fillText('出口',m.exit.x*T+12,m.exit.y*T+16);
   ctx.textAlign='left';
 }

 let npcColors=['#c14f4f','#4d7fb8','#699b55','#bd8744','#7f62a5'];
 (m.npcs||[]).forEach((n,i)=>{
   drawNpc(n.x*T,n.y*T,npcColors[i%npcColors.length],i%2?'#51351f':'#2b211b',i);
   // quest-giver marker
   if((n.quest===1&&!state.flags.quest1)||(n.quest===2&&!state.flags.quest2)){
     ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(n.x*T+12,n.y*T-3,7,0,Math.PI*2);ctx.fill();
     ctx.fillStyle='#1c1c1c';ctx.font='bold 11px sans-serif';ctx.fillText('!',n.x*T+10,n.y*T+1);
   }
 });

 for(let ch of(m.chests||[]))if(!state.chests[ch.id]){
   ctx.fillStyle='#5b371c';ctx.fillRect(ch.x*T+2,ch.y*T+9,20,12);
   ctx.fillStyle='#d69a32';ctx.fillRect(ch.x*T+3,ch.y*T+6,18,8);
   ctx.fillStyle='#f0c85a';ctx.fillRect(ch.x*T+10,ch.y*T+11,4,6);
   ctx.strokeStyle='#2c1a0d';ctx.strokeRect(ch.x*T+2,ch.y*T+6,20,15)
 }

 if(m.boss&&!bossDone(m.boss.id)){
   ctx.fillStyle=bosses[m.boss.id].color;ctx.fillRect(m.boss.x*T+2,m.boss.y*T+2,20,20);
   ctx.fillStyle='#fff';ctx.fillRect(m.boss.x*T+6,m.boss.y*T+6,3,3);ctx.fillRect(m.boss.x*T+15,m.boss.y*T+6,3,3)
 }

 // Hero is visually distinct from NPCs
 drawHero(state.x*T,state.y*T);

 // Context-sensitive guide in towns
 if(m.kind=='town'){
   let guide='';
   if(state.map==='osaka'&&!state.flags.quest1) guide='Aで「！」の住人に話しかけよう';
   else if(state.map==='kyoto'&&!state.flags.quest2) guide='Aで「！」の住人に話しかけよう';
   else guide='黄色い「出口」からフィールドへ';
   ctx.fillStyle='#fffef0ee';ctx.fillRect(55,318,250,28);
   ctx.strokeStyle='#6f5a2d';ctx.strokeRect(55,318,250,28);
   ctx.fillStyle='#171717';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
   ctx.fillText(guide,180,337);ctx.textAlign='left';
 }

 updateTop();
}
const controls=document.getElementById('controls');
const moveZone=document.getElementById('moveZone');
const joystick=document.getElementById('joystick');
const stick=document.getElementById('stick');
let joyActive=false,joyPointer=null,joyCenterX=0,joyCenterY=0,joyTimer=null,lastJoyDir='';

function stopJoyTimer(){if(joyTimer){clearInterval(joyTimer);joyTimer=null}}
function resetStick(){
  joyActive=false;joyPointer=null;lastJoyDir='';stopJoyTimer();
  joystick.style.display='none';
  stick.style.left='38px';stick.style.top='38px';
}
function doJoyStep(dir){
  if(!dir||mode!=='map')return;
  if(dir==='left')move(-1,0,'left');
  if(dir==='right')move(1,0,'right');
  if(dir==='up')move(0,-1,'up');
  if(dir==='down')move(0,1,'down');
}
function updateFloatingJoy(e){
  let dx=e.clientX-joyCenterX,dy=e.clientY-joyCenterY;
  const max=34,dist=Math.hypot(dx,dy)||1;
  if(dist>max){dx=dx/dist*max;dy=dy/dist*max}
  stick.style.left=(38+dx)+'px';stick.style.top=(38+dy)+'px';
  let dir='';
  if(Math.hypot(dx,dy)>14){
    // Wider diagonal transition makes accidental direction changes less common.
    if(Math.abs(dx)>Math.abs(dy)*1.18)dir=dx>0?'right':'left';
    else if(Math.abs(dy)>Math.abs(dx)*1.18)dir=dy>0?'down':'up';
    else dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  }
  if(dir!==lastJoyDir){
    lastJoyDir=dir;stopJoyTimer();
    if(dir){
      doJoyStep(dir);
      joyTimer=setInterval(()=>{if(joyActive&&lastJoyDir)doJoyStep(lastJoyDir)},115);
    }
  }
}
moveZone.addEventListener('pointerdown',e=>{
  if(mode!=='map')return;
  e.preventDefault();joyActive=true;joyPointer=e.pointerId;moveZone.setPointerCapture(e.pointerId);
  const cr=controls.getBoundingClientRect();
  const radius=58;
  let x=e.clientX-cr.left,y=e.clientY-cr.top;
  // Keep the floating base fully inside the left zone.
  x=Math.max(radius+4,Math.min(cr.width*.55-radius-4,x));
  y=Math.max(radius+4,Math.min(cr.height-radius-4,y));
  joyCenterX=cr.left+x;joyCenterY=cr.top+y;
  joystick.style.left=(x-radius)+'px';joystick.style.top=(y-radius)+'px';
  joystick.style.display='block';
  updateFloatingJoy(e);
});
moveZone.addEventListener('pointermove',e=>{if(joyActive&&e.pointerId===joyPointer){e.preventDefault();updateFloatingJoy(e)}});
moveZone.addEventListener('pointerup',e=>{if(e.pointerId===joyPointer)resetStick()});
moveZone.addEventListener('pointercancel',e=>{if(e.pointerId===joyPointer)resetStick()});
document.getElementById('abtn').addEventListener('pointerdown',e=>{e.preventDefault();if(mode=='message')closeMsg();else interact()});
document.getElementById('menuBtn').addEventListener('pointerdown',e=>{e.preventDefault();if(mode=='map')openMenu();else if(mode=='menu')closePanels()});
document.addEventListener('keydown',e=>{if(e.key=='ArrowUp')move(0,-1,'up');if(e.key=='ArrowDown')move(0,1,'down');if(e.key=='ArrowLeft')move(-1,0,'left');if(e.key=='ArrowRight')move(1,0,'right');if(e.key=='Enter'||e.key==' ')mode=='message'?closeMsg():interact();});
render();
</script>
